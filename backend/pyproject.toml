[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "orca-backend"
version = "0.1.0"
description = "ORCA Marine Intelligence Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.8.2",
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.15.0",
    # Redis
    "redis>=5.0.4",
    "slowapi>=0.1.9",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # LangGraph / LangChain
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    # RAG / Embeddings
    "sentence-transformers>=3.0.0",
    "pgvector>=0.3.0",
    # Scientific data
    "xarray>=2024.1.0",
    "netCDF4>=1.6.5",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "geopandas>=0.14.4",
    "shapely>=2.0.4",
    "rasterio>=1.3.10",
    # Scheduling
    "apscheduler>=3.10.4",
    # HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    # Logging
    "structlog>=24.1.0",
    # Monitoring
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
